name: Build desktop installers

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        run: npx tauri build --bundles msi

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: npx tauri build --bundles dmg

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: forge-ui-windows-${{ github.run_number }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: forge-ui-macos-${{ github.run_number }}
          if-no-files-found: error
          path: src-tauri/target/release/bundle/dmg/*.dmg

  attach-to-release:
    name: Attach installers to Release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          pattern: forge-ui-*-${{ github.run_number }}
          path: release-assets
          merge-multiple: true

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber
